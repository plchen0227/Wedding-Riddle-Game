<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪盜基德的預告 · 尋找戒指</title>
<style>
  :root{
    --navy:#0f1b2e;
    --navy2:#16263f;
    --gold:#c9a227;
    --gold-light:#e6c862;
    --silver:#e8eaed;
    --paper:#f5f1e6;
    --ink:#1c2333;
    --muted:#93a0b8;
    --danger:#e2716b;
    --success:#7fb37a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, var(--navy2) 0%, var(--navy) 70%);
    color:var(--silver);
    font-family:"Noto Serif TC","PMingLiU",serif;
    min-height:100vh;
    padding:0 0 4rem;
  }
  .stars{
    position:relative;
    overflow:hidden;
  }
  .moon{
    width:64px;height:64px;border-radius:50%;
    background:var(--gold-light);
    margin:2.5rem auto 1rem;
    box-shadow:0 0 40px rgba(230,200,98,0.35);
  }
  header{
    text-align:center;
    padding:0 1.5rem 1.5rem;
    border-bottom:1px solid rgba(201,162,39,0.25);
  }
  h1{
    font-size:1.6rem;
    font-weight:400;
    letter-spacing:0.08em;
    margin:0 0 0.6rem;
    color:var(--gold-light);
  }
  .sub{
    font-size:0.85rem;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:0 1.25rem;
  }
  .card{
    background:rgba(22,38,63,0.7);
    border:1px solid rgba(201,162,39,0.25);
    border-radius:10px;
    padding:1.3rem 1.4rem;
    margin-top:1.6rem;
  }
  .intro-text{
    font-size:0.95rem;
    line-height:2;
    color:var(--silver);
    white-space:pre-line;
    text-align:center;
  }
  .name-gate input{
    width:100%;
    padding:0.7rem 0.9rem;
    margin-top:0.8rem;
    border-radius:6px;
    border:1px solid rgba(201,162,39,0.4);
    background:rgba(245,241,230,0.06);
    color:var(--silver);
    font-size:1rem;
    font-family:inherit;
  }
  .name-gate input::placeholder{color:var(--muted);}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn-gold{
    width:100%;
    margin-top:0.9rem;
    padding:0.7rem 1rem;
    border-radius:6px;
    border:1px solid var(--gold);
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:var(--navy);
    font-weight:700;
    font-size:0.95rem;
    letter-spacing:0.04em;
  }
  .btn-gold:active{transform:scale(0.98);}
  .btn-ghost{
    width:100%;
    margin-top:0.6rem;
    padding:0.6rem 1rem;
    border-radius:6px;
    border:1px solid rgba(201,162,39,0.35);
    background:transparent;
    color:var(--gold-light);
    font-size:0.85rem;
  }
  #game-area{display:none;}
  .letter-bank{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin:1rem 0 0.4rem;
  }
  .letter-slot{
    min-width:36px;height:auto;
    padding:0.4rem 0.6rem;
    border:1px solid rgba(201,162,39,0.4);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;font-weight:700;
    color:var(--muted);
    background:rgba(245,241,230,0.04);
    word-break:break-all;
  }
  .letter-slot.filled{
    color:var(--navy);
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    border-color:var(--gold-light);
  }
  .progress-label{
    text-align:center;
    font-size:0.78rem;
    color:var(--muted);
    letter-spacing:0.05em;
    margin-bottom:0.4rem;
  }
  .puzzle{
    margin-top:1.1rem;
    padding:1.1rem 1.2rem;
    border-radius:10px;
    border:1px solid rgba(201,162,39,0.22);
    background:rgba(22,38,63,0.55);
  }
  .puzzle.solved{
    border-color:rgba(127,179,122,0.5);
    background:rgba(127,179,122,0.08);
  }
  .puzzle-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:0.5rem;
  }
  .puzzle-num{
    font-size:0.72rem;
    color:var(--gold-light);
    letter-spacing:0.08em;
  }
  .puzzle-title{
    font-size:1.02rem;
    font-weight:400;
    margin:0.15rem 0 0.5rem;
    color:var(--silver);
  }
  .puzzle-body{
    font-size:0.9rem;
    line-height:1.8;
    color:var(--muted);
    margin-bottom:0.8rem;
    white-space:pre-line;
  }
  .puzzle-row{
    display:flex;
    gap:8px;
  }
  .puzzle-row input{
    flex:1;
    padding:0.6rem 0.8rem;
    border-radius:6px;
    border:1px solid rgba(201,162,39,0.35);
    background:rgba(245,241,230,0.06);
    color:var(--silver);
    font-size:0.95rem;
    font-family:inherit;
  }
  .puzzle-row button{
    padding:0.6rem 1rem;
    border-radius:6px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold-light);
    font-size:0.85rem;
    white-space:nowrap;
  }
  .puzzle-msg{
    font-size:0.82rem;
    margin-top:0.5rem;
    min-height:1.1em;
  }
  .puzzle-msg.err{color:var(--danger);}
  .puzzle-msg.ok{color:var(--success);}
  .solved-tag{
    font-size:0.78rem;
    color:var(--success);
    letter-spacing:0.03em;
  }
  .story-text{
    margin-top:0.6rem;
    padding:0.7rem 0.9rem;
    border-radius:8px;
    background:rgba(201,162,39,0.08);
    border:1px solid rgba(201,162,39,0.25);
    font-size:0.85rem;
    line-height:1.8;
    color:var(--silver);
    white-space:pre-line;
  }
  #success-screen{
    display:none;
    text-align:center;
    padding:2rem 1.4rem;
  }
  #success-screen .moon{margin-bottom:1.2rem;}
  #success-screen h2{
    color:var(--gold-light);
    font-weight:400;
    font-size:1.3rem;
    letter-spacing:0.05em;
  }
  #success-screen p{
    color:var(--silver);
    line-height:2;
    font-size:0.95rem;
    white-space:pre-line;
  }
  .order-tag{
    display:inline-block;
    margin-top:1rem;
    padding:0.5rem 1.1rem;
    border:1px solid rgba(201,162,39,0.4);
    border-radius:20px;
    font-size:0.85rem;
    color:var(--gold-light);
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.7rem;
    margin-top:2rem;
    letter-spacing:0.05em;
  }
</style>
</head>

/* ================= 以下為程式邏輯，一般不需修改 ================= */

let guestName = "";
let solvedFlags = new Array(CONFIG.puzzles.length).fill(false);
let answersGiven = new Array(CONFIG.puzzles.length).fill("");

function normalize(s){
  return (s || "").trim().toUpperCase();
}

function renderLetterBank(){
  const bank = document.getElementById('letter-bank');
  bank.innerHTML = "";
  CONFIG.puzzles.forEach((p, i) => {
    const slot = document.createElement('div');
    slot.className = 'letter-slot' + (solvedFlags[i] ? ' filled' : '');
    slot.textContent = solvedFlags[i] ? answersGiven[i] : '?';
    if(solvedFlags[i]){
      slot.style.cursor = 'pointer';
      slot.title = '點一下重新作答';
      slot.addEventListener('click', () => {
        solvedFlags[i] = false;
        renderLetterBank();
        renderPuzzles();
        saveProgress();
      });
    }
    bank.appendChild(slot);
  });
  const count = solvedFlags.filter(Boolean).length;
  document.getElementById('progress-label').textContent = `已作答 ${count} / ${CONFIG.puzzles.length} 題`;
  const revealBtn = document.getElementById('reveal-final-btn');
  if(count === CONFIG.puzzles.length){
    revealBtn.style.display = 'block';
  } else {
    revealBtn.style.display = 'none';
  }
}

function renderPuzzles(){
  const list = document.getElementById('puzzle-list');
  list.innerHTML = "";
  CONFIG.puzzles.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'puzzle' + (solvedFlags[i] ? ' solved' : '');
    const isCorrect = solvedFlags[i] && normalize(answersGiven[i]) === normalize(p.answer);
    div.innerHTML = `
      <div class="puzzle-head">
        <span class="puzzle-num">第 ${i+1} 關　　${p.title}</span>
        ${solvedFlags[i] ? '<span class="solved-tag">已送出答案</span>' : ''}
      </div>
      ${isCorrect ? `<div class="story-text">${p.story || ''}</div>` : ''}
      ${solvedFlags[i] ? '' : `
        <div class="puzzle-row">
          <input type="text" id="pz-input-${i}" placeholder="輸入答案" value="${answersGiven[i] || ''}">
          <button data-idx="${i}">提交</button>
        </div>
        <div class="puzzle-msg" id="pz-msg-${i}"></div>
      `}
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('button[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      submitPuzzle(idx);
    });
  });
}

function submitPuzzle(idx){
  const input = document.getElementById(`pz-input-${idx}`);
  const msg = document.getElementById(`pz-msg-${idx}`);
  const val = (input.value || "").trim();
  if(!val){
    msg.textContent = "請先輸入答案";
    msg.className = "puzzle-msg err";
    return;
  }
  answersGiven[idx] = val;
  solvedFlags[idx] = true;
  renderLetterBank();
  renderPuzzles();
  saveProgress();
}

async function saveProgress(){
  if(!guestName) return;
  try{
    await window.storage.set('progress:' + guestName, JSON.stringify({
      name: guestName,
      solvedFlags: solvedFlags,
      answersGiven: answersGiven,
      updatedAt: Date.now()
    }), true);
  }catch(e){
    console.error('saveProgress failed', e);
  }
}

async function loadProgress(name){
  try{
    const result = await window.storage.get('progress:' + name, true);
    if(result && result.value){
      const data = JSON.parse(result.value);
      if(Array.isArray(data.solvedFlags) && data.solvedFlags.length === CONFIG.puzzles.length){
        solvedFlags = data.solvedFlags;
      }
      if(Array.isArray(data.answersGiven) && data.answersGiven.length === CONFIG.puzzles.length){
        answersGiven = data.answersGiven;
      }
    }
  }catch(e){
    // 沒有紀錄，維持初始狀態
  }
}

async function recordCompletion(){
  if(!CONFIG.googleScriptUrl) return;
  try{
    const url = CONFIG.googleScriptUrl + '?name=' + encodeURIComponent(guestName);
    await fetch(url, { mode: 'no-cors' });
  }catch(e){
    console.error('recordCompletion failed', e);
  }
}

document.getElementById('start-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('guest-name');
  const err = document.getElementById('gate-err');
  const name = (nameInput.value || "").trim();
  if(!name){
    err.textContent = "請先輸入你的名字";
    return;
  }
  err.textContent = "";
  guestName = name;

  await loadProgress(guestName);

  document.getElementById('gate-area').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  renderLetterBank();
  renderPuzzles();
});

document.getElementById('reveal-final-btn').addEventListener('click', () => {
  evaluateFinal();
});

document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('success-screen').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  renderLetterBank();
  renderPuzzles();
});

async function evaluateFinal(){
  const allCorrect = CONFIG.puzzles.every((p, i) => normalize(answersGiven[i]) === normalize(p.answer));

  document.getElementById('game-area').style.display = 'none';
  document.getElementById('success-screen').style.display = 'block';

  const titleEl = document.getElementById('result-title');
  const textEl = document.getElementById('success-text');
  const orderTag = document.getElementById('order-tag');
  const retryBtn = document.getElementById('retry-btn');
  const gemLeft = document.getElementById('gem-left');
  const gemRight = document.getElementById('gem-right');
  const xLeft = document.getElementById('x-left');
  const xRight = document.getElementById('x-right');

  if(allCorrect){
    gemLeft.style.display = '';
    gemRight.style.display = '';
    xLeft.style.display = 'none';
    xRight.style.display = 'none';
    titleEl.innerHTML = '謝謝你<br>見證與守護我們的幸福';
    textEl.textContent = '';
    orderTag.style.display = 'none';
    retryBtn.style.display = 'none';
    await recordCompletion();
  } else {
    gemLeft.style.display = 'none';
    gemRight.style.display = 'none';
    xLeft.style.display = '';
    xRight.style.display = '';
    titleEl.textContent = '出了點問題';
    textEl.textContent = '出了點問題';
    orderTag.style.display = 'none';
    retryBtn.style.display = 'inline-block';
  }
}
</script>

</body>
</html>
