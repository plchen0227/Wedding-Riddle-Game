<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪盜基德的預告 · 尋找戒指</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#e9dcb8;
    --ivory2:#faf5e4;
    --border-gold:#d3b981;
    --gold:#b8912f;
    --gold-light:#d8b256;
    --ink:#2a2620;
    --muted:#8a7f63;
    --danger:#b5473f;
    --success:#5e7a4c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:"Noto Serif TC","PMingLiU",serif;
    min-height:100vh;
    padding:1.5rem 0 4rem;
  }
  .moon{
    width:64px;height:64px;
    margin:0 auto 1.2rem;
    display:block;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:0 1.25rem;
  }
  .frame{
    position:relative;
    background:var(--ivory2);
    border:16px solid var(--border-gold);
    box-shadow: inset 0 0 0 1.5px var(--gold);
    padding:1.8rem 1.4rem;
    margin-top:1.6rem;
  }
  .corner{
    position:absolute;
    width:40px;
    height:40px;
    pointer-events:none;
  }
  .corner.tl{top:6px;left:6px;}
  .corner.tr{top:6px;right:6px;transform:scaleX(-1);}
  .corner.bl{bottom:6px;left:6px;transform:scaleY(-1);}
  .corner.br{bottom:6px;right:6px;transform:scale(-1,-1);}
  .intro-text{
    font-size:0.95rem;
    line-height:2;
    color:var(--ink);
    white-space:pre-line;
    text-align:center;
  }
  .mincho{font-family:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC","PMingLiU",serif;}
  .notice-title{
    font-size:1.9rem;font-weight:700;letter-spacing:0.28em;
    text-indent:0.28em;text-align:center;color:var(--ink);
    margin:0.2rem 0 0.2rem;line-height:1.4;
  }
  .notice-rule{display:block;margin:0 auto 1.1rem;width:78%;max-width:260px;height:14px;}
  .notice-body{
    font-size:1.08rem;font-weight:600;letter-spacing:0.08em;
    line-height:2.3;text-align:center;color:var(--ink);white-space:pre-line;
  }
  .name-gate input{
    width:100%;
    padding:0.7rem 0.9rem;
    margin-top:0.8rem;
    border:1px solid var(--border-gold);
    background:#fffdf6;
    color:var(--ink);
    font-size:1rem;
    font-family:inherit;
  }
  .name-gate input::placeholder{color:var(--muted);}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn-gold{
    width:100%;
    margin-top:0.9rem;
    padding:0.7rem 1rem;
    border:1px solid var(--gold);
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#fffdf6;
    font-weight:700;
    font-size:0.95rem;
    letter-spacing:0.04em;
  }
  .btn-gold:active{transform:scale(0.98);}
  .btn-ghost{
    width:100%;
    margin-top:0.6rem;
    padding:0.6rem 1rem;
    border:1px solid var(--border-gold);
    background:transparent;
    color:var(--gold);
    font-size:0.85rem;
  }
  #game-area{display:none;}
  .letter-bank{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin:0 0 1rem;
  }
  .letter-slot{
    min-width:36px;height:auto;
    padding:0.4rem 0.6rem;
    border:1px solid var(--border-gold);
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;font-weight:700;
    color:var(--muted);
    background:rgba(184,145,47,0.06);
    word-break:break-all;
  }
  .letter-slot.filled{
    color:#fffdf6;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    border-color:var(--gold);
  }
  input.letter-slot{
    width:31px;min-width:0;height:42px;padding:0;
    text-align:center;font-size:1.3rem;font-weight:700;
    color:var(--ink);font-family:inherit;border-radius:0;
    background:rgba(184,145,47,0.06);text-transform:uppercase;
  }
  input.letter-slot:focus{outline:none;border-color:var(--gold);background:#fffdf6;}
  input.letter-slot.filled,input.letter-slot.filled:focus{color:var(--ink);background:#f1e2b0;border-color:var(--gold);}
  .given-answer{font-size:0.9rem;color:var(--muted);margin:0.2rem 0 0.4rem;}
  .given-answer b{color:var(--gold);font-size:1.15rem;letter-spacing:0.1em;margin-left:0.2em;}
  .puzzle-row input{min-width:0;flex:1;}
  .puzzle-row button{flex:none;}
  .letter-bank{gap:5px !important;}
  .redo-btn{background:none;border:none;color:var(--muted);font-size:0.78rem;text-decoration:underline;cursor:pointer;padding:0;margin-top:0.5rem;font-family:inherit;}
  .progress-label{
    text-align:center;
    font-size:0.78rem;
    color:var(--muted);
    letter-spacing:0.05em;
    margin-bottom:0.7rem;
  }
  .puzzle{
    margin-top:1.1rem;
    padding:1.1rem 1.2rem;
    border:1px solid var(--border-gold);
    background:rgba(184,145,47,0.05);
  }
  .puzzle.solved{
    border-color:var(--success);
    background:rgba(94,122,76,0.08);
  }
  .puzzle-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:0.5rem;
  }
  .puzzle-num{
    font-size:0.85rem;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.04em;
  }
  .puzzle-title{
    font-size:1.02rem;
    font-weight:400;
    margin:0.15rem 0 0.5rem;
    color:var(--ink);
  }
  .puzzle-body{
    font-size:0.9rem;
    line-height:1.8;
    color:var(--muted);
    margin-bottom:0.8rem;
    white-space:pre-line;
  }
  .puzzle-row{
    display:flex;
    gap:8px;
  }
  .puzzle-row input{
    flex:1;
    padding:0.6rem 0.8rem;
    border:1px solid var(--border-gold);
    background:#fffdf6;
    color:var(--ink);
    font-size:0.95rem;
    font-family:inherit;
  }
  .puzzle-row button{
    padding:0.6rem 1rem;
    border:1px solid var(--gold);
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#fffdf6;
    font-weight:700;
    font-size:0.85rem;
    white-space:nowrap;
  }
  .puzzle-msg{
    font-size:0.82rem;
    margin-top:0.5rem;
    min-height:1.1em;
  }
  .puzzle-msg.err{color:var(--danger);}
  .puzzle-msg.ok{color:var(--success);}
  .solved-tag{
    font-size:0.78rem;
    color:var(--success);
    letter-spacing:0.03em;
  }
  .story-text{
    margin-top:0.6rem;
    padding:0.7rem 0.9rem;
    background:rgba(184,145,47,0.1);
    border:1px solid var(--border-gold);
    font-size:0.85rem;
    line-height:1.8;
    color:var(--ink);
    white-space:pre-line;
  }
  #success-screen{
    display:none;
    text-align:center;
  }
  #success-screen h2{
    color:var(--ink);
    font-weight:700;
    font-size:1.3rem;
    line-height:1.9;
    letter-spacing:0.03em;
  }
  #success-screen p{
    color:var(--ink);
    line-height:2;
    font-size:0.95rem;
    white-space:pre-line;
  }
  .order-tag{
    display:inline-block;
    margin-top:1rem;
    padding:0.5rem 1.1rem;
    border:1px solid var(--border-gold);
    border-radius:20px;
    font-size:0.85rem;
    color:var(--gold);
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.7rem;
    margin-top:2rem;
    letter-spacing:0.05em;
  }
</style>
</head>

  <footer>南港雅悅旗艦館 馥儷廳 · 2026.10.25</footer>

</div>

<script>
/* ================= 設定區：之後把題目內容改在這裡 ================= */

const CONFIG = {
  // 最終答案（大寫），必須恰好由下面7題的字母組成
  finalWord: "TURKIYE",

  // Google Apps Script 網址，用來記錄賓客完成的姓名與時間
  googleScriptUrl: "https://script.google.com/macros/s/AKfycbywTomgpBtWx3CEPazB1F25RnMA1sgetbs7-bLUVrA2H8T42noY6RjFngtfCBr2n6OZlw/exec",

  puzzles: [
    {
      title: "怪盜Wordle？",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "K",
      letter: "K",
      story: "海藍寶石，雙魚座的誕生石，象徵溫柔與勇氣；\n藍寶石，處女座的誕生石，象徵堅貞與勇氣。\n戒指以銀河為背景，由兩顆海藍寶石與一顆藍寶石組成，代表新郎守護新娘，也彼此相互輝映。"
    },
    {
      title: "怪盜Wordle？",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "I",
      letter: "I",
      story: "我都唸  IKEA"
    },
    {
      title: "新郎第一次唱歌給新娘聽的回憶",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "U",
      letter: "U",
      story: "新郎與新娘剛在一起沒多久，新郎就去北海道打工度假與新娘分隔兩地，他們將道不完的想念化為歌曲唱給彼此聽。"
    },
    {
      title: "今天是新郎與新娘在一起的第？天",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "Y",
      letter: "Y",
      story: "今天是我們在一起的第幾天是情侶間的隨堂考，還好有TimeTree可以偷看答案。"
    },
    {
      title: "新娘與菠蘿麵包",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "R",
      letter: "R",
      story: "新郎的各種ID總是使用メロンパン，因為，Melon是他的，胖也是。"
    },
    {
      title: "偷走與守護",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "E",
      letter: "E",
      story: "蘆屋的向日葵即使已不存在，人們依舊保存著它美麗的記憶。\n<em>Looking back on our days together,\nI was like a Kid in a candy store.</em>\n今天要取走的從來就不是戒指，而是娶走Melon與守護她，\n以及分享我們之間的點滴，讓這份幸福回憶也有你們參與。"
    },
    {
      title: "真相永遠只有一個",
      body: "【題目內容預留位置，之後替換成實際謎題文字】",
      answer: "T",   // 賓客要輸入的正解（不分大小寫）
      letter: "T",
      story: "各位偵探們，在了解新郎與新娘小故事的同時，把字母排序到正確的位置，一起解開怪盜基德預告信的謎底吧！"
    }
  ]
};

/* ================= 以下為程式邏輯，一般不需修改 ================= */

let guestName = "";
let solvedFlags = new Array(CONFIG.puzzles.length).fill(false);
let answersGiven = new Array(CONFIG.puzzles.length).fill("");

function normalize(s){
  return (s || "").trim().toUpperCase();
}

let typedLetters = new Array(CONFIG.puzzles.length).fill("");

function updateStatus(){
  const count = solvedFlags.filter(Boolean).length;
  document.getElementById('progress-label').textContent = `已作答 ${count} / ${CONFIG.puzzles.length} 題`;
  const full = typedLetters.every(l => l);
  document.getElementById('reveal-final-btn').style.display = full ? 'block' : 'none';
  document.querySelectorAll('#letter-bank input').forEach((el, i) => {
    el.classList.toggle('filled', !!typedLetters[i]);
  });
}

function renderLetterBank(){
  const bank = document.getElementById('letter-bank');
  bank.innerHTML = "";
  CONFIG.puzzles.forEach((p, i) => {
    const el = document.createElement('input');
    el.type = 'text';
    el.maxLength = 1;
    el.className = 'letter-slot';
    el.value = typedLetters[i] || '';
    el.setAttribute('autocomplete', 'off');
    el.setAttribute('autocapitalize', 'characters');
    el.setAttribute('aria-label', '答案字母 ' + (i+1));
    el.addEventListener('input', () => {
      const v = (el.value || '').trim().toUpperCase().slice(-1);
      el.value = v;
      typedLetters[i] = v;
      updateStatus();
      saveProgress();
      if(v && i < CONFIG.puzzles.length - 1){
        bank.children[i+1].focus();
      }
    });
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !el.value && i > 0){
        bank.children[i-1].focus();
      }
    });
    bank.appendChild(el);
  });
  updateStatus();
}

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPuzzles(){
  const list = document.getElementById('puzzle-list');
  list.innerHTML = "";
  CONFIG.puzzles.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'puzzle' + (solvedFlags[i] ? ' solved' : '');
    const isCorrect = solvedFlags[i] && normalize(answersGiven[i]) === normalize(p.answer);
    div.innerHTML = `
      <div class="puzzle-head">
        <span class="puzzle-num">${p.title}</span>
        ${solvedFlags[i] ? '<span class="solved-tag">已送出答案</span>' : ''}
      </div>
      ${solvedFlags[i] ? `<div class="given-answer">你的答案：<b>${escapeHtml(answersGiven[i].toUpperCase())}</b></div>` : ''}
      ${isCorrect ? `<div class="story-text">${p.story || ''}</div>` : ''}
      ${solvedFlags[i] ? `<button class="redo-btn" data-redo="${i}">修改答案</button>` : `
        <div class="puzzle-row">
          <input type="text" id="pz-input-${i}" placeholder="輸入答案" value="${escapeHtml(answersGiven[i] || '')}" autocomplete="off">
          <button data-idx="${i}">提交</button>
        </div>
        <div class="puzzle-msg" id="pz-msg-${i}"></div>
      `}
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('button[data-redo]').forEach(btn => {
    btn.addEventListener('click', () => {
      solvedFlags[parseInt(btn.getAttribute('data-redo'))] = false;
      updateStatus();
      renderPuzzles();
      saveProgress();
    });
  });
  list.querySelectorAll('button[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      submitPuzzle(idx);
    });
  });
}

function submitPuzzle(idx){
  const input = document.getElementById(`pz-input-${idx}`);
  const msg = document.getElementById(`pz-msg-${idx}`);
  const val = (input.value || "").trim();
  if(!val){
    msg.textContent = "請先輸入答案";
    msg.className = "puzzle-msg err";
    return;
  }
  answersGiven[idx] = val;
  solvedFlags[idx] = true;
  updateStatus();
  renderPuzzles();
  saveProgress();
}

async function saveProgress(){
  if(!guestName) return;
  try{
    await window.storage.set('progress:' + guestName, JSON.stringify({
      name: guestName,
      solvedFlags: solvedFlags,
      answersGiven: answersGiven,
      typedLetters: typedLetters,
      updatedAt: Date.now()
    }), true);
  }catch(e){
    console.error('saveProgress failed', e);
  }
}

async function loadProgress(name){
  try{
    const result = await window.storage.get('progress:' + name, true);
    if(result && result.value){
      const data = JSON.parse(result.value);
      if(Array.isArray(data.solvedFlags) && data.solvedFlags.length === CONFIG.puzzles.length){
        solvedFlags = data.solvedFlags;
      }
      if(Array.isArray(data.answersGiven) && data.answersGiven.length === CONFIG.puzzles.length){
        answersGiven = data.answersGiven;
      }
      if(Array.isArray(data.typedLetters) && data.typedLetters.length === CONFIG.puzzles.length){
        typedLetters = data.typedLetters;
      }
    }
  }catch(e){
    // 沒有紀錄，維持初始狀態
  }
}

async function recordCompletion(){
  if(!CONFIG.googleScriptUrl) return;
  try{
    const url = CONFIG.googleScriptUrl + '?name=' + encodeURIComponent(guestName);
    await fetch(url, { mode: 'no-cors' });
  }catch(e){
    console.error('recordCompletion failed', e);
  }
}

document.getElementById('start-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('guest-name');
  const err = document.getElementById('gate-err');
  const name = (nameInput.value || "").trim();
  if(!name){
    err.textContent = "請先輸入你的名字";
    return;
  }
  err.textContent = "";
  guestName = name;

  await loadProgress(guestName);

  document.getElementById('gate-area').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  renderLetterBank();
  renderPuzzles();
});

document.getElementById('reveal-final-btn').addEventListener('click', () => {
  evaluateFinal();
});

document.getElementById('retry-btn').addEventListener('click', () => {
  document.getElementById('success-screen').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  renderLetterBank();
  renderPuzzles();
});

async function evaluateFinal(){
  const allCorrect = typedLetters.join('').toUpperCase() === CONFIG.finalWord.toUpperCase();

  document.getElementById('game-area').style.display = 'none';
  document.getElementById('success-screen').style.display = 'block';

  const titleEl = document.getElementById('result-title');
  const textEl = document.getElementById('success-text');
  const orderTag = document.getElementById('order-tag');
  const retryBtn = document.getElementById('retry-btn');
  const gemLeft = document.getElementById('gem-left');
  const gemRight = document.getElementById('gem-right');
  const xLeft = document.getElementById('x-left');
  const xRight = document.getElementById('x-right');

  if(allCorrect){
    gemLeft.style.display = '';
    gemRight.style.display = '';
    xLeft.style.display = 'none';
    xRight.style.display = 'none';
    titleEl.innerHTML = '謝謝你<br>見證與守護我們的幸福';
    textEl.textContent = '';
    orderTag.style.display = 'none';
    retryBtn.style.display = 'none';
    await recordCompletion();
  } else {
    gemLeft.style.display = 'none';
    gemRight.style.display = 'none';
    xLeft.style.display = '';
    xRight.style.display = '';
    titleEl.textContent = '出了點問題';
    textEl.textContent = '提示：如果提交的答案正確，會出現一段新郎新娘小故事，回去檢查答案，並調整上方字母的順序吧~';
    orderTag.style.display = 'none';
    retryBtn.style.display = 'inline-block';
  }
}
</script>
