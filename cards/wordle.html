  :root{--ivory:#e9dcb8;--ivory2:#faf5e4;--border-gold:#d3b981;--gold:#b8912f;--ink:#2a2620;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--ivory);}
  body{font-family:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC","PMingLiU",serif;color:var(--ink);padding:20px 12px;display:flex;justify-content:center;}
  .card-wrap{width:min(100%,960px);container-type:inline-size;}
  .card{width:100%;aspect-ratio:297/210;position:relative;background:var(--ivory2);border:3.4cqw solid var(--border-gold);box-shadow:inset 0 0 0 .3cqw var(--gold);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.6cqw 2cqw;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .corner{position:absolute;width:7cqw;height:7cqw;}
  .corner.tl{top:.4cqw;left:.4cqw;}.corner.tr{top:.4cqw;right:.4cqw;transform:scaleX(-1);}
  .corner.bl{bottom:.4cqw;left:.4cqw;transform:scaleY(-1);}.corner.br{bottom:.4cqw;right:.4cqw;transform:scale(-1,-1);}
  .title{font-size:5.6cqw;font-weight:700;letter-spacing:.14em;text-indent:.14em;line-height:1.3;}
  .rule{display:block;width:30cqw;height:2cqw;margin:.8cqw auto 1.8cqw;}
  .wordle{display:block;width:57cqw;height:auto;border:.3cqw solid #7d7d7d;box-shadow:0 .5cqw 1.2cqw rgba(60,50,30,.28);cursor:zoom-in;}
  .hint{position:absolute;right:4.4cqw;bottom:4.2cqw;font-size:2cqw;letter-spacing:.2em;color:var(--gold);pointer-events:none;}
  .lb{position:fixed;inset:0;background:rgba(20,16,8,.98);display:none;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;}
  .lb.on{display:block;}
  .lb .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 10px 20px;}
  .lb svg{display:block;width:100%;max-width:1200px;height:auto;cursor:zoom-in;}
  .lb.z svg{width:220vw;max-width:none;cursor:zoom-out;}
  .lb .bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(20,16,8,.9);z-index:2;color:#faf5e4;font-size:.85rem;letter-spacing:.1em;}
  .lb button{font:inherit;font-size:.9rem;padding:.4rem .9rem;border:1px solid #d8b256;background:transparent;color:#faf5e4;cursor:pointer;letter-spacing:.1em;}
  @page{size:297mm 210mm;margin:0;}
  @media print{
    html,body{background:none;}
    body{padding:0;display:block;}
    .card-wrap{width:297mm;height:210mm;}
    .card{width:297mm;height:210mm;aspect-ratio:auto;}
    .lb,.hint{display:none !important;}
    .wordle{cursor:default;box-shadow:none;}
  }

<script>
(function(){
  var lb=document.getElementById('lb'),wrap=document.getElementById('lb-wrap'),src=document.getElementById('wordle');
  function open(){var c=src.cloneNode(true);c.removeAttribute('id');c.setAttribute('class','');wrap.innerHTML='';wrap.appendChild(c);
    c.addEventListener('click',function(e){e.stopPropagation();lb.classList.toggle('z');if(!lb.classList.contains('z'))lb.scrollLeft=0;});
    lb.classList.remove('z');lb.scrollTop=0;lb.scrollLeft=0;lb.classList.add('on');document.documentElement.style.overflow='hidden';}
  function close(){lb.classList.remove('on','z');document.documentElement.style.overflow='';}
  src.addEventListener('click',open);
  document.getElementById('lb-close').addEventListener('click',close);
  lb.addEventListener('click',function(e){if(e.target===lb||e.target===wrap)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
