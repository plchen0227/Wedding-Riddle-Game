  :root{
    --ivory:#e9dcb8; --ivory2:#faf5e4; --border-gold:#d3b981;
    --gold:#b8912f; --gold-light:#d8b256; --ink:#2a2620;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--ivory);}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
    font-family:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC","PMingLiU",serif;
    color:var(--ink);
  }
  /* 卡片本體：比例 A6 (105 × 148 mm)。內部所有尺寸用 cqw（卡片寬度的 1/100），
     所以手機上縮放、列印時 105mm，版面完全一致。 */
  .card-wrap{width:min(100%,440px);container-type:inline-size;}
  .card{
    width:100%;aspect-ratio:105/148;position:relative;
    background:var(--ivory2);
    border:7cqw solid var(--border-gold);
    box-shadow:inset 0 0 0 .4cqw var(--gold);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:4cqw 5cqw;
    text-align:center;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .corner{position:absolute;width:15cqw;height:15cqw;}
  .corner.tl{top:1.2cqw;left:1.2cqw;}
  .corner.tr{top:1.2cqw;right:1.2cqw;transform:scaleX(-1);}
  .corner.bl{bottom:1.2cqw;left:1.2cqw;transform:scaleY(-1);}
  .corner.br{bottom:1.2cqw;right:1.2cqw;transform:scale(-1,-1);}

  .title{
    font-size:7.6cqw;font-weight:700;letter-spacing:.1em;text-indent:.1em;white-space:nowrap;
    line-height:1.3;color:var(--ink);
  }
  .sub{
    margin-top:1.6cqw;
    font-size:5.2cqw;font-weight:600;letter-spacing:.34em;text-indent:.34em;
    color:var(--gold);
  }
  .rule{display:block;width:62cqw;height:3.4cqw;margin:4cqw auto 6cqw;}
  .photo{
    width:100%;
    border:.9cqw solid var(--gold);
    padding:1.2cqw;background:#fffdf6;
    box-shadow:0 .6cqw 1.6cqw rgba(90,70,20,.18);
  }
  .photo img{display:block;width:100%;height:auto;}

  @page{size:210mm 297mm;margin:0;}
  @media print{
    html,body{background:none;}
    body{padding:0;min-height:0;display:block;}
    .card-wrap{width:210mm;}
    .card{width:210mm;height:297mm;aspect-ratio:auto;}
    .photo{box-shadow:none;}
  }
